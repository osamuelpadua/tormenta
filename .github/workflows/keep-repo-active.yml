name: Keep Repo Active

on:
  schedule:
    # Roda a cada 20 dias às 07:00 UTC para evitar desativação dos workflows pelo GitHub
    - cron: "0 7 1,21 * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit vazio para manter repositório ativo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep repo active [skip ci]"
          git push
